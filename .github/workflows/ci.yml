name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (offline)
        run: pytest

  # Runs the notebooks end to end against the real API. Manual only: it costs
  # money and needs a key. Run it before tagging a release, and after any SDK
  # bump — this is what catches examples that have silently rotted.
  notebooks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[rag,notebooks,dev]"

      - name: Execute notebooks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GENAI_TUTORIAL_MODEL: claude-haiku-4-5
        run: |
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter execute "$nb"
            echo "::endgroup::"
          done
